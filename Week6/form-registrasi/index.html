<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Registrasi Mahasiswa</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="container">
  <section class="card">
    <header class="header">
      <div class="icon">🎓</div>
      <h1>Form Registrasi Mahasiswa</h1>
      <p>Silakan lengkapi data registrasi berikut.</p>
    </header>
    <form id="registration-form" novalidate>
      <div class="form-group autocomplete-wrap">
        <label for="nama">Nama Mahasiswa</label>
        <input id="nama" type="text" placeholder="Ketik nama mahasiswa..." autocomplete="off">
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        <small class="help">Ketik beberapa huruf untuk melihat rekomendasi nama.</small>
        <small class="error" id="nama-error"></small>
      </div>
      <div class="form-group">
        <label for="nim">NIM</label>
        <input id="nim" type="text" placeholder="Masukkan NIM">
        <small class="error" id="nim-error"></small>
      </div>
      <div class="form-group">
        <label for="matakuliah">Mata Kuliah</label>
        <select id="matakuliah">
          <option value="">-- Pilih Mata Kuliah --</option>
          <option>Pemrograman Web</option><option>Pemrograman Berbasis Objek</option>
          <option>Konsep Perangkat Lunak</option><option>Jaringan Komputer</option>
          <option>Konsep Kecerdasan Artifisial</option><option>Matematika Diskrit</option>
          <option>Teori Graf</option>
        </select>
        <small class="error" id="matakuliah-error"></small>
      </div>
      <div class="form-group">
        <label for="dosen">Dosen</label>
        <select id="dosen">
          <option value="">-- Pilih Dosen --</option>
          <option>Fajar Baskoro, S.Kom., M.T.</option><option>Dr. Royyana Muslim Ijtihadie, S.Kom., M.Kom., Ph.D.</option>
          <option>Sarwosri, S.Kom., M.T.</option><option>Misbakhul Munir Irfan Subakti, S.Kom., M.Sc.</option>
          <option>Rizky Januar Akbar, S.Kom., M.Eng.</option>
          <option>Prof. Ir. Tohari Ahmad, S.Kom., M.Sc., Ph.D.</option>
          <option>Arya Yudhi Wijaya, S.Kom., M.Kom.</option>
          <option>Imam Mustafa Kamal, S.ST, Ph.D</option>
        </select>
        <small class="error" id="dosen-error"></small>
      </div>
      <div class="actions">
        <button class="primary" type="submit">Daftar</button>
        <button class="secondary" type="reset" id="reset-button">Reset</button>
      </div>
    </form>
    <div id="result" class="result" role="status" hidden></div>
  </section>
  <footer>Latihan JavaScript — Form Registrasi Mahasiswa</footer>
</main>
</body>
</html>
