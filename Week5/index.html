<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="navbar">
      <a class="brand" href="#" aria-label="Student Management">
        <span class="brand-icon" aria-hidden="true">🎓</span>
        <span>Student Management</span>
      </a>
      <nav class="nav-menu" aria-label="Navigasi utama">
        <a href="#home" class="nav-link">Home</a>
        <a href="#students" class="nav-link">Students</a>
        <a href="#about" class="nav-link">About</a>
      </nav>
      <button class="profile-button" type="button" aria-label="Profil pengguna">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="white"/><circle cx="12" cy="9" r="3.1" fill="#164879"/><path d="M5.9 18.4c.7-3 2.8-4.5 6.1-4.5s5.4 1.5 6.1 4.5" fill="#164879"/></svg>
      </button>
    </header>

    <main class="dashboard" id="home">
      <section class="card form-card" aria-labelledby="form-title">
        <h1 id="form-title">Form Student</h1>
        <form id="student-form">
          <input type="hidden" id="edit-id">
          <div class="form-group">
            <label for="nim">NIM</label>
            <input id="nim" name="nim" type="text" placeholder="Masukkan NIM" required>
          </div>
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input id="nama" name="nama" type="text" placeholder="Masukkan nama lengkap" required>
          </div>
          <div class="form-group">
            <label for="jurusan">Jurusan</label>
            <select id="jurusan" name="jurusan" required>
              <option value="">Pilih Jurusan</option>
              <option>Informatika</option>
              <option>Sistem Informasi</option>
              <option>Teknik Komputer</option>
              <option>Manajemen</option>
              <option>Akuntansi</option>
              <option>Desain Komunikasi Visual</option>
            </select>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Masukkan email" required>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="save-btn" type="submit"><span aria-hidden="true">▣</span> Simpan</button>
            <button class="btn btn-secondary" id="cancel-btn" type="button"><span aria-hidden="true">⊘</span> Batal</button>
            <button class="btn btn-danger" id="reset-btn" type="button"><span aria-hidden="true">⟳</span> Reset</button>
          </div>
        </form>
      </section>

      <section class="card data-card" id="students" aria-labelledby="data-title">
        <div class="table-header">
          <h2 id="data-title">Data Mahasiswa</h2>
          <label class="search-box" for="search-input">
            <input id="search-input" type="search" placeholder="Cari mahasiswa..." aria-label="Cari mahasiswa">
            <span class="search-icon" aria-hidden="true">⌕</span>
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>No</th><th>NIM</th><th>Nama</th><th>Jurusan</th><th>Email</th><th>Aksi</th></tr>
            </thead>
            <tbody id="student-rows"></tbody>
          </table>
          <div class="empty-state" id="empty-state" hidden>Data mahasiswa tidak ditemukan.</div>
        </div>
        <div class="table-footer">
          <p id="table-info">Menampilkan 1 - 5 dari 5 data</p>
          <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
        </div>
      </section>
    </main>
    <footer id="about" class="page-footer">Student Management</footer>
  </div>
</body>
</html>
